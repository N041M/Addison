# CI — the enforcement layer for conventions that were previously local-only
# (2026-07-19 maintainability review, "do all" wave). Three independent jobs
# mirror the three local gates exactly:
#
#   python    → ruff + pyright + pytest   (safety-invariant tests live here)
#   frontend  → eslint + tsc + vitest + vite build
#   rust      → cargo test in the Tauri shell
#
# A convention is only as strong as its enforcement; before this workflow every
# gate depended on someone remembering to run it before merging.
#
# TWO MORE SINCE THE WINDOWS PORT (2026-08-23), both running the SAME script on a
# Windows runner:
#
#   rust-windows    → the whole Rust job, on the platform whose `#[cfg]` arms no
#                     other runner compiles. `exec.rs`'s Job Object and
#                     `PeekNamedPipe` paths exist only here.
#   python-windows  → `gates.sh python-floors`, a NAMED SUBSET and not the suite.
#                     That script says why, and the reason is written there rather
#                     than here so there is still exactly one copy of it.
name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff · pyright · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_core/pyproject.toml
      # Editable install so `import agent_core` resolves the checked-out tree
      # (pyproject lives inside agent_core/ and maps the package onto ".").
      - name: Install agent core (editable, with dev extras) + type checker
        run: |
          pip install -e "agent_core[dev]"
          pip install pyright
      # ruff + pyright + pytest. The commands live in scripts/gates.sh, not here,
      # so what CI runs and what a person runs are the same list by construction —
      # see that script's header for the three-way disagreement that caused.
      - name: Gates (ruff · pyright · pytest)
        run: ./scripts/gates.sh python

  frontend:
    name: frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - name: Install
        run: npm ci
      # eslint + tsc (BOTH configs) + vitest + build, from scripts/gates.sh.
      # This step previously ran `npx tsc --noEmit`, which checks src only — so
      # the tsconfig.test.json gate had never actually run here — and `npm run
      # lint` without --max-warnings=0, so warnings passed.
      - name: Gates (eslint · tsc · vitest · build)
        working-directory: .
        run: ./scripts/gates.sh frontend

  rust:
    name: rust (cargo test, Tauri shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri 2.x Linux build prerequisites (webkit2gtk 4.1 era). Needed even
      # for `cargo test` because the tauri crate links against them.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
      # cargo test + clippy, from scripts/gates.sh (which also stubs shell/dist —
      # `tauri::generate_context!` embeds frontendDist at compile time, so the
      # directory must exist; its contents don't matter for tests). clippy was
      # never a CI gate before, though it has been clean and locally expected.
      - name: Gates (cargo test · clippy)
        run: ./scripts/gates.sh rust

  rust-windows:
    name: rust (cargo test, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # No system dependencies: windows-latest ships the MSVC toolchain, and the
      # WebView2 runtime the Tauri shell links against is part of Windows itself.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri
      # The same script, through the bash that ships with the runner. `shell: bash`
      # is required — the default on this runner is PowerShell, which would not run
      # it at all.
      - name: Gates (cargo test · clippy)
        shell: bash
        run: ./scripts/gates.sh rust

  python-windows:
    name: python (floors, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_core/pyproject.toml
      - name: Install agent core (editable, with dev extras)
        run: pip install -e "agent_core[dev]"
      # A DELIBERATELY NARROWER JOB than the `python` one above, and the narrowing
      # lives in scripts/gates.sh where it can be widened file by file. What it is
      # here to catch: the Windows half of the G2 fence, whose assertions skip on
      # every other runner — a test that only ever skips has never run.
      - name: Gates (python floors)
        shell: bash
        run: ./scripts/gates.sh python-floors
