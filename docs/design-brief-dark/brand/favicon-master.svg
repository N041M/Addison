<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Favicon master: the mark filling the canvas (no Apple-grid margin — a
       favicon is already small). Geometry from the in-app ramp: radius ~12.5%,
       letter 69% of the tile baseline-left, dot 23% inset 14% top-right. -->
  <rect width="256" height="256" rx="32" fill="#16171B"/>
  <rect x="4" y="4" width="248" height="248" rx="28" fill="none" stroke="#26272B" stroke-width="8"/>
  <text x="46" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="184" letter-spacing="-7.4" fill="#E9E9E7">a</text>
  <circle cx="192" cy="64" r="30" fill="#B4A9F5"/>
</svg>
