<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Raster favicons, deliberately: the SVG version drew the mark's "a" with
         a <text> element, so its letterform and size depended on whichever font
         the rasterising platform resolved (measured: a 15-20% bbox difference
         off macOS). Rendered from docs/design-brief-dark/brand/favicon-master.svg
         by build-favicon.sh, so they are identical everywhere.

         Every size is rendered AT that size rather than squashed down from one
         larger file. Handed only a 64px icon a browser downscales it to 16, and
         a two-storey "a" does not survive that: it arrives as a grey smudge
         (reported 2026-07-26). 32 is what a retina tab asks for, 16 is for
         everything else. The master is also full bleed now — the old rounded
         one left transparent corners that some clients composite onto a white
         plate, which is the white box the mark used to sit in. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Addison</title>
    <script>
      // Theme bootstrap — runs before the stylesheet loads so there's no flash
      // of the wrong theme. Reads "addison.theme" ("light" | "dark" | "system"),
      // resolves "system" against the OS preference, sets the class the palette
      // keys off, and paints the background immediately. App.tsx keeps
      // localStorage in sync (and follows OS changes live while "system" is
      // chosen) afterwards. Mirror of lib/theme.ts — this runs before the bundle
      // loads, so it can't import it; keep them in step.
      //
      // The default is "system" (Match this computer) as of the 2026-07-25 dark
      // redesign: absent and legacy values both land there, so a machine set to
      // dark opens dark.
      (function () {
        try {
          var t = localStorage.getItem("addison.theme");
          if (t !== "light" && t !== "dark" && t !== "system") t = "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              typeof window.matchMedia === "function" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.backgroundColor = dark ? "#0C0C0D" : "#F7F7F5";
        } catch (e) {
          document.documentElement.style.backgroundColor = "#F7F7F5";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
