[package]
name = "addison"
version = "0.1.0"
description = "Addison — local-first consumer agent harness"
edition = "2021"
# RAISED FROM 1.77 by the `image` dependency below, which declares 1.88 — so 1.77
# stopped being true the moment that line landed, and a floor nothing can build at
# is a claim, not a floor. Stated here rather than worked around: pinning an older
# `image` to hold a number no CI runner or developer machine in this project is
# anywhere near would be paying in decoder bugs for a compatibility nobody wants.
rust-version = "1.88"

# Engineering-spec §1.2: Tauri 2.x. The Rust shell owns the OS-permission-sensitive
# code (keychain, filesystem picker, updater) and supervises the Python Agent Core.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"          # signed silent updates (design-doc §7.7) — wired in Phase 3
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rfd = "0.15"                        # native file dialogs (open/save picker) — §7.4.1
arboard = "3"                       # clipboard text (shell.readClipboard)
open = "5"                          # open http(s) links in the default browser (shell.openExternal)
base64 = "0.22"                     # encode picked images for shell.readScopedFile
uuid = { version = "1", features = ["v4"] }   # opaque file handles + device_id (§5)

# Decode, downscale and re-encode a picked picture (shell.readPickedImage,
# image-attach plan §4). DECODING IS THE VALIDATION on that path: a file that does
# not parse as an image is refused, which is what retires guessing content from a
# filename there — so this crate is not a convenience, it is the check.
#
# DEFAULT FEATURES OFF, and the trim is the point. The default set is
# `rayon` + every format the crate knows, which drags in the AVIF encoder (`ravif`,
# its own threading stack) plus exr, dds, hdr, pnm, qoi, tga — none of which a
# person picks out of a photo library, all of which would be new code inside the
# HIGHEST-TRUST process in this app. What is enabled is exactly what the picker's
# filter offers to decode (png/jpeg/gif/webp/bmp/tiff) and what the re-encode may
# land on (jpeg/png — the `png` and `jpeg` features carry both directions). HEIC is
# deliberately absent because the crate has no decoder for it at all; the picker
# still offers it and the refusal sentence covers it honestly.
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "webp", "bmp", "tiff",
] }

# SHA-256 of a file that is already on disk (shell.digestWorkspaceFiles, phase-3
# review surface). The core records the digest of what it WROTE; the shell answers
# what is there NOW, so the review surface can tell "as Addison left it" from "edited
# since" without a byte of file content crossing the bridge. Already in the lockfile
# as a transitive dependency of the Tauri stack, so declaring it adds no new code to
# the build — only the right to call it.
sha2 = "0.10"

# SIGKILL for a command that overruns its budget (exec.rs, step 5.5). std::process
# offers no timed wait and no signal, and a catchable signal is one a runaway shell
# can ignore — so the one libc call is `kill(pid, SIGKILL)` and nothing more.
libc = "0.2"

# Device identity keypair (§5): ed25519 signing key generated in the shell on first
# launch, private half stored ONLY in the OS keychain. `rand_core`'s OsRng is the
# CSPRNG that seeds it; the `rand_core` feature exposes `SigningKey::generate`.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# OS keychain (BYOK keys, device key) — §5. Feature-select the platform-native
# store per target so a macOS `cargo check` never tries to build the Linux
# secret-service backend (and vice-versa). Cross-platform packaging is Phase 3.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
