[package]
name = "addison"
version = "0.1.0"
description = "Addison — local-first consumer agent harness"
edition = "2021"
rust-version = "1.77"

# Engineering-spec §1.2: Tauri 2.x. The Rust shell owns the OS-permission-sensitive
# code (keychain, filesystem picker, updater) and supervises the Python Agent Core.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"          # signed silent updates (design-doc §7.7) — wired in Phase 3
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rfd = "0.15"                        # native file dialogs (open/save picker) — §7.4.1
arboard = "3"                       # clipboard text (shell.readClipboard)
open = "5"                          # open http(s) links in the default browser (shell.openExternal)
base64 = "0.22"                     # encode picked images for shell.readScopedFile
uuid = { version = "1", features = ["v4"] }   # opaque file handles + device_id (§5)

# SHA-256 of a file that is already on disk (shell.digestWorkspaceFiles, phase-3
# review surface). The core records the digest of what it WROTE; the shell answers
# what is there NOW, so the review surface can tell "as Addison left it" from "edited
# since" without a byte of file content crossing the bridge. Already in the lockfile
# as a transitive dependency of the Tauri stack, so declaring it adds no new code to
# the build — only the right to call it.
sha2 = "0.10"


# Device identity keypair (§5): ed25519 signing key generated in the shell on first
# launch, private half stored ONLY in the OS keychain. `rand_core`'s OsRng is the
# CSPRNG that seeds it; the `rand_core` feature exposes `SigningKey::generate`.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# OS keychain (BYOK keys, device key) — §5. Feature-select the platform-native
# store per target so a macOS `cargo check` never tries to build the Linux
# secret-service backend (and vice-versa). Cross-platform packaging is Phase 3.
# SIGKILL for a command that overruns its budget, and launchd's uid for a service
# target (exec.rs + automation.rs). std::process offers no timed wait and no
# signal, and a catchable signal is one a runaway shell can ignore. UNIX-ONLY
# rather than unconditional, because every call site is: naming the platform in the
# manifest is what makes "this does not exist off Unix" a fact the build checks
# rather than a comment someone has to believe.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows's answers to the two things `std::process` cannot do portably
# (exec.rs, `mod plat`): a Job Object, so a timeout reaches everything the command
# started rather than only the shell that forked it, and `PeekNamedPipe`, so a
# drain can tell an empty pipe from a closed one without blocking on it. Already in
# the lockfile as a transitive dependency of the Tauri stack, so declaring it adds
# no new code to the build — only the right to call it, and only in `mod plat`.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
